---
name: "Test: Central Publish (USER_MANAGED)"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      publishing-type:
        description: "Publishing type"
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      dry-run:
        description: "Dry run (skip upload)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "action.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/testing.yaml"
  # Deliberately pull_request (not pull_request_target): the job checks out
  # and runs the code under test, so it must stay unprivileged. Fork PRs
  # therefore receive no secrets and degrade to an unsigned, upload-free
  # run; see the 'Determine test mode' step below. No paths filter: the
  # default branch ruleset requires 'Build and Publish Test', so it must
  # report on every pull request or the pull request cannot merge.
  pull_request:
    branches: [main]
  # Weekly, on main: catches what breaks outside this repository, such as an
  # expired token, a revoked signing key or a Portal API change.
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

# A new push to a pull request cancels its previous run. Every other run
# (push, schedule, workflow_dispatch) gets a group of its own, so no merge to
# main cancels, or queues behind, another's upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 'Build and Publish Test'
    # Records each run as a deployment to this environment. It holds no
    # secrets and has no protection rules: the credentials below come from
    # organisation and repository configuration, and fork pull requests never
    # receive them.
    environment: integration-auto
    runs-on: ubuntu-24.04
    # Room for the action's own polling plus the wait before a drop
    timeout-minutes: 20
    permissions:
      contents: read  # Read repository contents
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@e214be6d4111cbb6d3f8ed00f405cdd84070f52d'  # v0.23.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Only for scripts/drop-deployment.sh; the action itself comes from $/
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Determine test mode
        id: mode
        env:
          CENTRAL_USERNAME: ${{ vars.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          TEST_NAMESPACE: ${{ vars.CENTRAL_TEST_NAMESPACE }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Select signing/upload behaviour based on credential availability.
          set -euo pipefail

          # A run is entitled to the repository secrets unless it comes from
          # a fork pull request or from Dependabot (which reads a separate
          # secret store). PR_HEAD_REPO is empty for non-PR events. A
          # scheduled run is always trusted: it runs main, whoever its
          # actor is.
          credentials_expected='true'
          if [ "${EVENT_NAME}" = 'schedule' ]; then
            :
          elif [ "${ACTOR}" = 'dependabot[bot]' ]; then
            credentials_expected='false'
          elif [ -n "${PR_HEAD_REPO}" ] &&
               [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; then
            credentials_expected='false'
          fi

          # Runs without credentials still exercise the parts of the action
          # that need none: input validation, checksum generation and bundle
          # creation.
          if [ -n "${CENTRAL_USERNAME}" ] && [ -n "${CENTRAL_TOKEN}" ] &&
             [ -n "${GPG_PRIVATE_KEY_B64}" ]; then
            signing_method='gpg'
            dry_run="${DRY_RUN_INPUT:-false}"
          elif [ "${credentials_expected}" = 'true' ]; then
            # Never degrade a trusted run to a dry-run: that would hide a
            # regression in the signing and upload path behind a green tick.
            echo "::error::Publishing credentials missing for a trusted run;" \
              "expected the CENTRAL_USERNAME variable and the CENTRAL_TOKEN" \
              "and GPG_PRIVATE_KEY_B64 secrets"
            exit 1
          else
            echo "::notice::Publishing credentials unavailable; running an" \
              "unsigned dry-run (no upload to Central Portal)"
            signing_method='none'
            dry_run='true'
          fi

          # The Maven groupId comes from configuration. A run that signs or
          # is entitled to the secrets must have it; only an unsigned dry
          # run, whose bundle never leaves the runner, may use a placeholder.
          if [ -n "${TEST_NAMESPACE}" ]; then
            namespace="${TEST_NAMESPACE}"
          elif [ "${signing_method}" = 'gpg' ] ||
               [ "${credentials_expected}" = 'true' ]; then
            echo "::error::Test namespace missing for a trusted run;" \
              "expected the CENTRAL_TEST_NAMESPACE variable"
            exit 1
          else
            namespace='org.example'
          fi

          groupid_re='^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'
          if ! [[ "${namespace}" =~ ${groupid_re} ]]; then
            echo "::error::CENTRAL_TEST_NAMESPACE is not a valid Maven" \
              "groupId: expected dot-separated segments of letters," \
              "digits, '-' and '_'"
            exit 1
          fi

          # The token username is a configuration variable, not a secret;
          # logging it shows which token the run used.
          echo "Token username: ${CENTRAL_USERNAME:-(unset)}"
          echo "Signing method: ${signing_method}"
          echo "Dry run: ${dry_run}"
          echo "Namespace: ${namespace}"
          {
            echo "signing-method=${signing_method}"
            echo "dry-run=${dry_run}"
            echo "namespace=${namespace}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create test Maven project
        env:
          GROUP_ID: ${{ steps.mode.outputs.namespace }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A fresh version per run and attempt: Central rejects a second
          # upload of the same coordinates, and any -SNAPSHOT version.
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          project_url="${SERVER_URL}/${REPOSITORY}"
          server_host="${SERVER_URL#*://}"
          echo "Coordinates: ${GROUP_ID}:test-central-publish:${version}"

          # Create a minimal Maven project with required Central metadata.
          # The Java package is fixed: a groupId may hold '-', which a Java
          # package name may not.
          mkdir -p test-project/src/main/java/centralpublish/citest
          mkdir -p test-project/src/main/javadoc

          # Unquoted delimiter: the POM takes the values above. It holds no
          # other '$', backtick or backslash for the shell to expand.
          cat > test-project/pom.xml << POMEOF
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${GROUP_ID}</groupId>
            <artifactId>test-central-publish</artifactId>
            <version>${version}</version>
            <packaging>jar</packaging>

            <name>Test Central Publish</name>
            <description>Test artifact for central-publish-action CI</description>
            <url>${project_url}</url>

            <licenses>
              <license>
                <name>Apache-2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0</url>
              </license>
            </licenses>

            <developers>
              <developer>
                <name>The Linux Foundation Release Engineering</name>
              </developer>
            </developers>

            <scm>
              <connection>scm:git:${project_url}.git</connection>
              <developerConnection>scm:git:ssh://git@${server_host}/${REPOSITORY}.git</developerConnection>
              <url>${project_url}</url>
            </scm>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-source-plugin</artifactId>
                  <version>3.3.1</version>
                  <executions>
                    <execution>
                      <id>attach-sources</id>
                      <goals><goal>jar-no-fork</goal></goals>
                    </execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-javadoc-plugin</artifactId>
                  <version>3.11.2</version>
                  <executions>
                    <execution>
                      <id>attach-javadocs</id>
                      <goals><goal>jar</goal></goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POMEOF

          # Create a minimal Java source file
          cat > test-project/src/main/java/centralpublish/citest/Hello.java << 'JAVAEOF'
          package centralpublish.citest;

          /** Test class for Maven Central publication testing. */
          public class Hello {
              /** Returns greeting. */
              public static String greet() {
                  return "Hello from central-publish-action test!";
              }
          }
          JAVAEOF

      - name: Build and deploy to local repo
        run: |
          set -euo pipefail
          cd test-project
          mvn clean deploy \
            -DaltDeploymentRepository="local::default::file://${GITHUB_WORKSPACE}/m2repo" \
            -B -q

          echo "=== Deployed artifacts ==="
          find "${GITHUB_WORKSPACE}/m2repo" -type f | sort

      - name: Run central-publish-action
        id: publish
        uses: $/
        with:
          m2repo-path: m2repo
          central-username: ${{ vars.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          signing-method: ${{ steps.mode.outputs.signing-method }}
          publishing-type: ${{ inputs.publishing-type || 'USER_MANAGED' }}
          dry-run: ${{ steps.mode.outputs.dry-run }}

      # Drops a VALIDATED or FAILED test deployment, even after a failure, so
      # none is left for a stray click on "Publish" to release. Manual runs
      # keep theirs for inspection; see the script for the rules.
      - name: Drop the test deployment
        if: always() && steps.publish.outputs.deployment_id != ''
        env:
          CENTRAL_URL: https://central.sonatype.com
          CENTRAL_USERNAME: ${{ vars.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_POLL_TIMEOUT: "180"
          INPUT_POLL_INTERVAL: "15"
        run: bash scripts/drop-deployment.sh

  mock-portal:
    name: 'Mock Portal Tests'
    # Exercises the scripts against tests/mock_central.py; needs no secrets,
    # so it runs in full on fork pull requests too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # Read repository contents
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@e214be6d4111cbb6d3f8ed00f405cdd84070f52d'  # v0.23.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run script tests
        run: python3 -m unittest discover -s tests -t . -v

      # End to end: stage with the action, then release that deployment.
      - name: Start mock Central Portal
        run: |
          set -euo pipefail
          nohup python3 tests/mock_central.py --port 8765 \
            > "${RUNNER_TEMP}/mock-central.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mock Central Portal did not start"
          exit 1

      - name: Generate a throwaway signing key
        id: key
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/throwaway-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'CPA CI <ci@example.invalid>' ed25519 sign never
          key="$(gpg --armor --export-secret-keys ci@example.invalid | base64 -w0)"
          echo "::add-mask::${key}"
          echo "private-key=${key}" >> "$GITHUB_OUTPUT"

      - name: Create test Maven repository
        run: python3 tests/fixtures.py m2repo

      - name: Stage (upload mode, USER_MANAGED)
        id: stage
        uses: $/
        with:
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          gpg-private-key: ${{ steps.key.outputs.private-key }}
          poll-interval: "1"
          poll-timeout: "30"

      - name: Check staging signed every artefact
        env:
          STATUS: ${{ steps.stage.outputs.deployment_status }}
        run: |
          set -euo pipefail
          test "$STATUS" = VALIDATED
          python3 - << 'PYEOF'
          from pathlib import Path
          from tests.fixtures import ARTEFACTS
          missing = [a for a in ARTEFACTS if not Path("m2repo", a + ".asc").is_file()]
          print("Unsigned:", missing or "none")
          raise SystemExit(1 if missing else 0)
          PYEOF

      - name: Release (publish mode)
        id: release
        uses: $/
        with:
          mode: publish
          deployment-id: ${{ steps.stage.outputs.deployment_id }}
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          poll-interval: "1"
          poll-timeout: "30"

      - name: Re-run release (already published)
        id: rerun
        uses: $/
        with:
          mode: publish
          deployment-id: ${{ steps.stage.outputs.deployment_id }}
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          poll-interval: "1"
          poll-timeout: "30"

      - name: Stage again (upload mode, sigul pre-signed)
        id: stage-again
        uses: $/
        with:
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          signing-method: sigul
          poll-interval: "1"
          poll-timeout: "30"

      - name: Change an artefact after staging
        run: echo tampered >> m2repo/org/example/demo/1.0.0/demo-1.0.0.war

      # Runs publish mode's script directly, with its output captured, so
      # the refusal it is meant to produce leaves no error annotation on a
      # green run; the check is on the exit status and the reason given.
      - name: Release a deployment that no longer matches
        env:
          CENTRAL_URL: http://127.0.0.1:8765
          CENTRAL_USERNAME: user
          CENTRAL_TOKEN: token
          INPUT_DEPLOYMENT_ID: ${{ steps.stage-again.outputs.deployment_id }}
          INPUT_M2REPO: m2repo
          INPUT_SKIP_VERIFICATION: "false"
          INPUT_DRY_RUN: "false"
          INPUT_POLL_INTERVAL: "1"
          INPUT_POLL_TIMEOUT: "30"
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/mismatch.log"
          status=0
          GITHUB_OUTPUT="${RUNNER_TEMP}/mismatch-output" \
            bash scripts/publish.sh > "$log" 2>&1 || status=$?
          # Prefixed, so the runner reads none of its lines as a command
          sed 's/^/| /' "$log"
          war='org/example/demo/1.0.0/demo-1.0.0.war'
          refusal="::error::Deployment ${INPUT_DEPLOYMENT_ID} does not match"
          refusal="${refusal} ${INPUT_M2REPO}; not publishing it"
          if [ "$status" -eq 0 ]; then
            echo "::error::Publish mode accepted a deployment that no longer" \
              "matches ${INPUT_M2REPO}"
            exit 1
          fi
          if ! grep -qxF "$refusal" "$log" ||
             ! grep -qF "::error::SHA-256 mismatch for ${war}:" "$log"; then
            echo "::error::Publish mode failed (exit ${status}) for a reason" \
              "other than the changed ${war}; see its log above"
            exit 1
          fi
          echo "Publish mode refused the changed deployment (exit ${status})"

      - name: Check release results
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
          RELEASE_STATUS: ${{ steps.release.outputs.deployment_status }}
          RELEASE_VERIFIED: ${{ steps.release.outputs.verified_file_count }}
          RERUN_STATUS: ${{ steps.rerun.outputs.deployment_status }}
          MISMATCH_ID: ${{ steps.stage-again.outputs.deployment_id }}
        run: |
          set -euo pipefail
          mock='http://127.0.0.1:8765/_mock/deployments'
          test "$RELEASE_STATUS" = PUBLISHED
          test "$RELEASE_VERIFIED" -gt 0
          test "$RERUN_STATUS" = PUBLISHED
          test "$(curl -sf "${mock}/${DEPLOYMENT_ID}" | jq .publishCalls)" = 1
          test "$(curl -sf "${mock}/${MISMATCH_ID}" | jq .publishCalls)" = 0
          echo "Release, idempotent re-run and mismatch checks passed"

      - name: Show mock Central Portal log
        if: always()
        run: cat "${RUNNER_TEMP}/mock-central.log" || true
