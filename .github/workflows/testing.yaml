---
name: "Test: Central Publish (USER_MANAGED)"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      publishing-type:
        description: "Publishing type"
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      dry-run:
        description: "Dry run (skip upload)"
        type: boolean
        default: true
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "action.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/testing.yaml"
  # Deliberately pull_request (not pull_request_target): the job checks out
  # and runs the code under test, so it must stay unprivileged. Fork PRs
  # therefore receive no secrets and degrade to an unsigned, upload-free
  # run; see the 'Determine test mode' step below.
  pull_request:
    branches: [main]
    paths:
      - "action.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/testing.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build and Publish Test'
    # Scopes the publishing secrets to a dedicated environment. No reviewers
    # are configured: the trigger is pull_request, so fork PRs never receive
    # secrets and need no manual gate.
    environment: integration-auto
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # Read repository contents
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Determine test mode
        id: mode
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Select signing/upload behaviour based on credential availability.
          set -euo pipefail

          # A run is entitled to the repository secrets unless it comes from
          # a fork pull request or from Dependabot (which reads a separate
          # secret store). PR_HEAD_REPO is empty for non-PR events.
          credentials_expected='true'
          if [ "${ACTOR}" = 'dependabot[bot]' ]; then
            credentials_expected='false'
          elif [ -n "${PR_HEAD_REPO}" ] &&
               [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; then
            credentials_expected='false'
          fi

          # Runs without credentials still exercise the parts of the action
          # that need none: input validation, checksum generation and bundle
          # creation.
          if [ -n "${CENTRAL_USERNAME}" ] && [ -n "${CENTRAL_TOKEN}" ] &&
             [ -n "${GPG_PRIVATE_KEY_B64}" ]; then
            signing_method='gpg'
            dry_run="${DRY_RUN_INPUT:-false}"
          elif [ "${credentials_expected}" = 'true' ]; then
            # Never degrade a trusted run to a dry-run: that would hide a
            # regression in the signing and upload path behind a green tick.
            echo "::error::Publishing credentials missing for a trusted run;" \
              "expected CENTRAL_USERNAME, CENTRAL_TOKEN and" \
              "GPG_PRIVATE_KEY_B64"
            exit 1
          else
            echo "::notice::Publishing credentials unavailable; running an" \
              "unsigned dry-run (no upload to Central Portal)"
            signing_method='none'
            dry_run='true'
          fi

          echo "Signing method: ${signing_method}"
          echo "Dry run: ${dry_run}"
          echo "signing-method=${signing_method}" >> "$GITHUB_OUTPUT"
          echo "dry-run=${dry_run}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create test Maven project
        run: |
          set -euo pipefail

          # Create a minimal Maven project with required Central metadata
          mkdir -p test-project/src/main/java/io/github/askb/testcentral
          mkdir -p test-project/src/main/javadoc

          cat > test-project/pom.xml << 'POMEOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>io.github.askb</groupId>
            <artifactId>test-central-publish</artifactId>
            <version>0.0.1-test</version>
            <packaging>jar</packaging>

            <name>Test Central Publish</name>
            <description>Test artifact for central-publish-action CI</description>
            <url>https://github.com/lfreleng-actions/central-publish-action</url>

            <licenses>
              <license>
                <name>Apache-2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0</url>
              </license>
            </licenses>

            <developers>
              <developer>
                <name>Anil Belur</name>
                <email>askb23@gmail.com</email>
              </developer>
            </developers>

            <scm>
              <connection>scm:git:git://github.com/lfreleng-actions/central-publish-action.git</connection>
              <developerConnection>scm:git:ssh://github.com:lfreleng-actions/central-publish-action.git</developerConnection>
              <url>https://github.com/lfreleng-actions/central-publish-action</url>
            </scm>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-source-plugin</artifactId>
                  <version>3.3.1</version>
                  <executions>
                    <execution>
                      <id>attach-sources</id>
                      <goals><goal>jar-no-fork</goal></goals>
                    </execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-javadoc-plugin</artifactId>
                  <version>3.11.2</version>
                  <executions>
                    <execution>
                      <id>attach-javadocs</id>
                      <goals><goal>jar</goal></goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POMEOF

          # Create a minimal Java source file
          cat > test-project/src/main/java/io/github/askb/testcentral/Hello.java << 'JAVAEOF'
          package io.github.askb.testcentral;

          /** Test class for Maven Central publication testing. */
          public class Hello {
              /** Returns greeting. */
              public static String greet() {
                  return "Hello from central-publish-action test!";
              }
          }
          JAVAEOF

      - name: Build and deploy to local repo
        run: |
          set -euo pipefail
          cd test-project
          mvn clean deploy \
            -DaltDeploymentRepository="local::default::file://${GITHUB_WORKSPACE}/m2repo" \
            -B -q

          echo "=== Deployed artifacts ==="
          find "${GITHUB_WORKSPACE}/m2repo" -type f | sort

      - name: Run central-publish-action
        uses: $/
        with:
          m2repo-path: m2repo
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          signing-method: ${{ steps.mode.outputs.signing-method }}
          publishing-type: ${{ inputs.publishing-type || 'USER_MANAGED' }}
          dry-run: ${{ steps.mode.outputs.dry-run }}

  mock-portal:
    name: 'Mock Portal Tests'
    # Exercises the scripts against tests/mock_central.py; needs no secrets,
    # so it runs in full on fork pull requests too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # Read repository contents
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run script tests
        run: python3 -m unittest discover -s tests -t . -v

      # End to end: stage with the action, then release that deployment.
      - name: Start mock Central Portal
        run: |
          set -euo pipefail
          nohup python3 tests/mock_central.py --port 8765 \
            > "${RUNNER_TEMP}/mock-central.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mock Central Portal did not start"
          exit 1

      - name: Generate a throwaway signing key
        id: key
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/throwaway-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'CPA CI <ci@example.invalid>' ed25519 sign never
          key="$(gpg --armor --export-secret-keys ci@example.invalid | base64 -w0)"
          echo "::add-mask::${key}"
          echo "private-key=${key}" >> "$GITHUB_OUTPUT"

      - name: Create test Maven repository
        run: python3 tests/fixtures.py m2repo

      - name: Stage (upload mode, USER_MANAGED)
        id: stage
        uses: $/
        with:
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          gpg-private-key: ${{ steps.key.outputs.private-key }}
          poll-interval: "1"
          poll-timeout: "30"

      - name: Check staging signed every artefact
        env:
          STATUS: ${{ steps.stage.outputs.deployment_status }}
        run: |
          set -euo pipefail
          test "$STATUS" = VALIDATED
          python3 - << 'PYEOF'
          from pathlib import Path
          from tests.fixtures import ARTEFACTS
          missing = [a for a in ARTEFACTS if not Path("m2repo", a + ".asc").is_file()]
          print("Unsigned:", missing or "none")
          raise SystemExit(1 if missing else 0)
          PYEOF

      - name: Release (publish mode)
        id: release
        uses: $/
        with:
          mode: publish
          deployment-id: ${{ steps.stage.outputs.deployment_id }}
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          poll-interval: "1"
          poll-timeout: "30"

      - name: Re-run release (already published)
        id: rerun
        uses: $/
        with:
          mode: publish
          deployment-id: ${{ steps.stage.outputs.deployment_id }}
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          poll-interval: "1"
          poll-timeout: "30"

      - name: Stage again (upload mode, sigul pre-signed)
        id: stage-again
        uses: $/
        with:
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          signing-method: sigul
          poll-interval: "1"
          poll-timeout: "30"

      - name: Change an artefact after staging
        run: echo tampered >> m2repo/org/example/demo/1.0.0/demo-1.0.0.war

      - name: Release a deployment that no longer matches
        id: mismatch
        continue-on-error: true
        uses: $/
        with:
          mode: publish
          deployment-id: ${{ steps.stage-again.outputs.deployment_id }}
          m2repo-path: m2repo
          central-url: http://127.0.0.1:8765
          central-username: user
          central-token: token
          poll-interval: "1"
          poll-timeout: "30"

      - name: Check release results
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
          RELEASE_STATUS: ${{ steps.release.outputs.deployment_status }}
          RELEASE_VERIFIED: ${{ steps.release.outputs.verified_file_count }}
          RERUN_STATUS: ${{ steps.rerun.outputs.deployment_status }}
          MISMATCH_OUTCOME: ${{ steps.mismatch.outcome }}
          MISMATCH_ID: ${{ steps.stage-again.outputs.deployment_id }}
        run: |
          set -euo pipefail
          mock='http://127.0.0.1:8765/_mock/deployments'
          test "$RELEASE_STATUS" = PUBLISHED
          test "$RELEASE_VERIFIED" -gt 0
          test "$RERUN_STATUS" = PUBLISHED
          test "$(curl -sf "${mock}/${DEPLOYMENT_ID}" | jq .publishCalls)" = 1
          test "$MISMATCH_OUTCOME" = failure
          test "$(curl -sf "${mock}/${MISMATCH_ID}" | jq .publishCalls)" = 0
          echo "Release, idempotent re-run and mismatch checks passed"

      - name: Show mock Central Portal log
        if: always()
        run: cat "${RUNNER_TEMP}/mock-central.log" || true
